version: '3.8'

services:
  lenny-assistant:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OLLAMA_ENDPOINT=http://ollama:11434
    restart: unless-stopped

  # Optional local Ollama container
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
